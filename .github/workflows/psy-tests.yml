name: psy-tests
on:
  push:
    branches: [ main, m2-song ]
  workflow_dispatch:
concurrency:
  group: psy-tests-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Run all test suites (playground + foundation + consumer contract)
        run: node --test tests/
      - name: Foundation determinism replay check
        run: node --test tests/foundation.test.mjs
